# whisper-rs-sys builds ggml with CMake profile Release in release builds, and the
# cmake crate replaces CMAKE_<LANG>_FLAGS_RELEASE with cc's flags, which on MSVC lack
# /O2, so whisper ran ~10x slower than in dev builds (RelWithDebInfo). Pin the flags.
[env]
CMAKE_C_FLAGS_RELEASE = "/MD /O2 /Ob2 /DNDEBUG"
CMAKE_CXX_FLAGS_RELEASE = "/MD /O2 /Ob2 /DNDEBUG"

# Portable CPU baseline: never compile ggml for the build machine's CPU (AVX-512/AMX
# crash on older PCs). AVX2-era x86-64 only.
GGML_NATIVE = "OFF"
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"
GGML_BMI2 = "ON"
GGML_AVX_VNNI = "OFF"
GGML_AVX512 = "OFF"
GGML_AVX512_VBMI = "OFF"
GGML_AVX512_VNNI = "OFF"
GGML_AVX512_BF16 = "OFF"
GGML_AMX_TILE = "OFF"
GGML_AMX_INT8 = "OFF"
GGML_AMX_BF16 = "OFF"
