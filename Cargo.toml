[package]
name = "hush-voice"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.15"
global-hotkey = "0.8.0"
gpui = "0.2.2"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
